# ===== رصد — تشغيل إنتاجي =====
# خلفية uvicorn بلا إعادة تحميل + واجهة مبنية تُخدَّم عبر nginx (وكيل /api).
# التشغيل:  docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build: ./backend
    container_name: rasad-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: rasad-frontend
    ports:
      # الحلقة المحلية افتراضاً — ضعه خلف وكيل عكسي بـ TLS قبل عرضه للشبكة
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
