server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # لا تُفصح عن إصدار nginx في الترويسات وصفحات الخطأ
    server_tokens off;

    # ===== ترويسات أمنية =====
    # السياسة منقولة عن src-tauri/tauri.conf.json كي تتطابق نسخة الويب مع نسخة
    # سطح المكتب. 'unsafe-inline' في script-src مطلوب لبوتستراب Vite،
    # و'unsafe-eval' لـ globe.gl/Three، وinline في style-src لأنماط Leaflet.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.basemaps.cartocdn.com https://unpkg.com; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # فعّل HSTS فقط خلف TLS (وكيل عكسي أمامي):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ضغط الأصول النصية
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # وكيل مكالمات API إلى خدمة الخلفية داخل شبكة compose.
    # نضبط X-Forwarded-For إلى $remote_addr فقط (لا $proxy_add_x_forwarded_for
    # الذي يُلحق قيمة العميل فيسمح بانتحال IP)، فتصل الخلفية IP العميل الحقيقي
    # وحده. الخلفية تثق به فقط عند TRUST_PROXY_HEADERS=true (وضع الإنتاج).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # توجيه SPA — أي مسار غير موجود يعود إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # تخزين مؤقت طويل للأصول المُبصَّمة (hashed).
    # ملاحظة: add_header داخل location يُلغي كل الموروثة على مستوى الخادم، فنُعيد
    # مجموعة الأمان كاملة هنا (كانت ناقصة CSP/X-Frame-Options/Permissions/COOP).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.basemaps.cartocdn.com https://unpkg.com; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # لا نُخزّن Service Worker مؤقتاً كي تصل التحديثات فوراً.
    # نُعيد مجموعة الأمان كاملة (سكربت يُخدَّم بلا CSP كان الأخطر).
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.basemaps.cartocdn.com https://unpkg.com; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
