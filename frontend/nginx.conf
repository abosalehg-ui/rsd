server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # لا تُفصح عن إصدار nginx في الترويسات وصفحات الخطأ
    server_tokens off;

    # ===== ترويسات أمنية =====
    # المجموعة في snippets/security-headers.conf (مصدر واحد). `add_header` داخل
    # `location` يُلغي كل الموروثة، فنُعيد الإدراج في كل موضع بدل تكرار النصّ.
    include /etc/nginx/snippets/security-headers.conf;

    # ضغط الأصول النصية
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # وكيل مكالمات API إلى خدمة الخلفية داخل شبكة compose.
    # نضبط X-Forwarded-For إلى $remote_addr فقط (لا $proxy_add_x_forwarded_for
    # الذي يُلحق قيمة العميل فيسمح بانتحال IP)، فتصل الخلفية IP العميل الحقيقي
    # وحده. الخلفية تثق به فقط عند TRUST_PROXY_HEADERS=true (وضع الإنتاج).
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # توجيه SPA — أي مسار غير موجود يعود إلى index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # تخزين مؤقت طويل للأصول المُبصَّمة (hashed)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # لا نُخزّن Service Worker مؤقتاً كي تصل التحديثات فوراً.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
