# ===== رصد — ترويسات الأمان المشتركة (نشر nginx) =====
#
# كانت هذه المجموعة مكتوبة بنصّها ثلاث مرات داخل nginx.conf، لأن `add_header`
# داخل `location` يُلغي كل الترويسات الموروثة فيلزم إعادتها كاملةً في كل موضع.
# صارت ملفًّا واحدًا يُدرَج بـ `include`، فتعديل السياسة في مكان واحد.
#
# نظائرها لأهداف النشر الأخرى (أي تغيير هنا يلزم فيها):
#   - backend/app/middleware/security_headers.py  (وضع سطح المكتب / المُجمّع)
#   - frontend/index.html  (<meta> احتياطية لنشر GitHub Pages بلا خادم)
#
# ملاحظة على script-src: بلا 'unsafe-inline' ولا 'unsafe-eval'. بناء Vite
# الإنتاجي لا يُنتج سكربتات مضمّنة، ولا تستدعي three/globe.gl/leaflet `eval`
# ولا `new Function` — مُتحقَّق منه بالفحص على الحزم المبنية. أما
# style-src 'unsafe-inline' فمطلوب فعلًا: Leaflet وReact يكتبان سمات style.

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://unpkg.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.basemaps.cartocdn.com https://unpkg.com; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# فعّل HSTS فقط خلف TLS (وكيل عكسي أمامي):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
