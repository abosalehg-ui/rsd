[package]
name = "rsd"
version = "1.4.0"
description = "رصد — OSINT dashboard for the Middle East (desktop)"
authors = ["Rsd contributors"]
edition = "2021"
license = "MIT"
default-run = "rsd"

[lib]
name = "rsd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
