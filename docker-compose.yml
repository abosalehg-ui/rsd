services:
  backend:
    build: ./backend
    container_name: rasad-backend
    ports:
      # مربوط بالحلقة المحلية فقط — الـ API بلا مصادقة، فلا نعرضه على الشبكة.
      # لعرضه عمداً غيّرها إلى "8000:8000" بعد ضبط API_KEY ووكيل عكسي.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      # ربط ./.env كحجم يُنشئ مجلّداً بالاسم نفسه إن كان الملف مفقوداً
      - path: .env
        required: false
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      # صورة python:slim لا تحوي curl — نستخدم urllib المضمّن (BUG-4)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: rasad-frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # الخلفية في حاوية أخرى — بدون هذا يفشل وكيل /api في وضع compose
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
