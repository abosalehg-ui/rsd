name: Deploy Frontend to GitHub Pages

# - يُشغَّل عند الدفع إلى main عندما تتغير ملفات الواجهة (أو يدويًا)
# - يبني واجهة Vite ويرفع dist/ إلى GitHub Pages
#
# ملاحظة: الـ Backend (FastAPI) لا يمكن نشره على Pages.
# لتوصيل الواجهة بـ backend خارجي، اضبط Secret باسم VITE_API_BASE
# (Settings → Secrets and variables → Actions) بالقيمة:
#   https://api.example.com/api
# إن لم يُضبط، ستحاول الواجهة استدعاء /api على نفس النطاق (لن تعمل بالنشر العام).

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        env:
          # base path = /<repo-name>/ على Pages
          VITE_BASE: /${{ github.event.repository.name }}/
          # عنوان الـ backend الخارجي (اختياري)
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
