name: Feed health

# فحص أسبوعي لحيويّة خلاصات الإنتاج (RSS · إيران OSINT · الرصد النووي).
# خلاصة ميتة لا تُسقط CI الرئيسي (اعتماد خارجي)، لكنها لا تبقى صامتة أيضًا:
# عند الفشل يُفتح Issue واحد (أو يُحدَّث القائم) بقائمة الخلاصات المعطّلة.

on:
  schedule:
    - cron: '17 6 * * 1'   # الاثنين 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check feeds
        id: feeds
        continue-on-error: true
        run: |
          python scripts/check_feeds.py | tee feed-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update issue for dead feeds
        if: steps.feeds.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/feed-report.txt', 'utf8');
            const title = 'خلاصات معطّلة (فحص feed-health الأسبوعي)';
            const body = [
              'فحص `feed-health.yml` وجد خلاصات لا تردّ 200 أو بلا إدخالات.',
              'استبدل الرابط أو احذف الخلاصة من الجامع المعني، ثم أغلق هذه المسألة.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `آخر تشغيل: ${new Date().toISOString()} — ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'feed-health', per_page: 1,
            });
            if (issues.length) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['feed-health'] });
            }

      - name: Fail the job when feeds are dead
        if: steps.feeds.outputs.status != '0'
        run: exit 1
